<div class="toolbar" [ngClass]="{ 'show-dropdown': dropdownVisible }">
  <h2 class="app-title">
    <img
      class="banner-icon"
      src="assets/img/xomper-banner.jpg"
      alt="XOMPER"
      (click)="goToLanding()"
      style="cursor: pointer;"
    />
  </h2>

  <div class="tabs" [ngClass]="{ hidden: dropdownVisible }">
    <div>
      <!-- Always show Home/Search -->
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        [ngClass]="{ selected: isSelected('/') }"
      >
        Home
      </a>

      <!-- Authenticated user tabs -->
      <ng-container *ngIf="isLoggedIn()">
        <a
          routerLink="/my-profile"
          [queryParams]="{ userId: userId }"
          routerLinkActive="active"
          [ngClass]="{ selected: isSelected('/my-profile') }"
        >
          My Profile
        </a>
        <a
          *ngIf="leagueId"
          routerLink="/my-league"
          [queryParams]="{ leagueId: leagueId, view: 'league' }"
          routerLinkActive="active"
          [ngClass]="{ selected: isSelected('/my-league') }"
        >
          My League
        </a>
        <a
          *ngIf="teamUserName"
          routerLink="/my-team"
          [queryParams]="{ user: teamUserName, league: teamLeagueId }"
          routerLinkActive="active"
          [ngClass]="{ selected: isSelected('/my-team') }"
        >
          My Team
        </a>
        <a
          *ngIf="leagueId"
          routerLink="/taxi-squad"
          [queryParams]="{ league: leagueId }"
          routerLinkActive="active"
          [ngClass]="{ selected: isSelected('/taxi-squad') }"
        >
          Taxi Squad
        </a>
      </ng-container>
    </div>

    <!-- Sign Out Button (desktop) -->
    <button *ngIf="isLoggedIn()" class="sign-out-btn desktop-only" (click)="signOut()">
      Sign Out
    </button>
  </div>

  <!-- Dropdown Button (mobile) -->
  <div class="dropdown-button" (click)="toggleDropdown()">☰</div>

  <!-- Mobile Dropdown -->
  <div class="dropdown" *ngIf="dropdownVisible">
    <a
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="selectItem('/')"
    >
      Home
    </a>

    <ng-container *ngIf="isLoggedIn()">
      <a
        routerLink="/my-profile"
        [queryParams]="{ userId: userId }"
        routerLinkActive="active"
        (click)="selectItem('/my-profile')"
      >
        My Profile
      </a>
      <a
        *ngIf="leagueId"
        routerLink="/my-league"
        [queryParams]="{ leagueId: leagueId, view: 'league' }"
        routerLinkActive="active"
        (click)="selectItem('/my-league')"
      >
        My League
      </a>
      <a
        *ngIf="teamUserName"
        routerLink="/my-team"
        [queryParams]="{ user: teamUserName, league: teamLeagueId }"
        routerLinkActive="active"
        (click)="selectItem('/my-team')"
      >
        My Team
      </a>
      <a
        *ngIf="leagueId"
        routerLink="/taxi-squad"
        [queryParams]="{ league: leagueId }"
        routerLinkActive="active"
        (click)="selectItem('/taxi-squad')"
      >
        Taxi Squad
      </a>
      
      <!-- Sign Out (mobile) -->
      <a class="sign-out-link" (click)="signOut()">
        Sign Out
      </a>
    </ng-container>

    <!-- Guest sign in link -->
    <a *ngIf="!isLoggedIn()" routerLink="/" (click)="selectItem('/')">
      Sign In
    </a>
  </div>
</div>
