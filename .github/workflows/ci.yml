"on":
  pull_request:
    branches:
      - master
  workflow_dispatch:

name: CI

# Nothing gated merges to master before this: deploy-frontend.yml only fires on
# push to master, by which point the change has already shipped.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check style drift
        run: npm run lint:css

      - name: Production build
        run: npm run build
