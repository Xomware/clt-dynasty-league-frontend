name: Deploy CLT Dynasty League

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: Xomware/github-actions/.github/workflows/deploy-frontend-s3.yml@v1
    with:
      app: clt-dynasty
      role-key: AWS_DEPLOY_ROLE_ARN
      node-version: '18'
      ssm: |
        API_ID=/clt-dynasty/api/API_ID
      build-command: |
        npx ng test --no-watch --browsers=ChromeHeadless
        f=src/environments/environment.ts
        sed -i "s|apiId: '---'|apiId: '$API_ID'|" $f
        sed -i "s|supabaseUrl: '---'|supabaseUrl: '$SUPABASE_URL'|" $f
        sed -i "s|supabaseAnonKey: '---'|supabaseAnonKey: '$SUPABASE_ANON_KEY'|" $f
        if grep -q "'---'" $f; then
          echo "::error::environment.ts still has '---' placeholders"
          exit 1
        fi
        npm run build -- --configuration production
      dist-dir: dist/xomper-frontend
      bucket: clt.dynasty.xomware.com
      domain: clt.dynasty.xomware.com
